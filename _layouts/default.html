<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.data.settings.seo.description }}">
    <link rel="author" href="{{ site.data.settings.seo.rel-author }}">
    <link rel="stylesheet" href="{{ site.github.url }}/assets/css/site.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
    {% feed_meta %}
    {% include analytics.html %}
    <!-- Use Jekyll SEO plugin (also renders <title>) -->
    {% seo %}
  </head>
  <body class="{{ page.layout }}">
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}

    <script>
      document.getElementById('navToggle').addEventListener('click', function () {
        var open = document.body.classList.toggle('nav-open');
        this.setAttribute('aria-expanded', open);
      });

      // Submit Formspree contact forms in place and count them as leads.
      document.querySelectorAll('.contact-form').forEach(function (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var status = form.querySelector('.form-status');
          var button = form.querySelector('button[type="submit"]');
          button.disabled = true;
          status.textContent = 'Sending…';
          fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } })
            .then(function (res) {
              if (!res.ok) throw new Error(res.status);
              form.reset();
              form.classList.add('sent');
              status.textContent = "Thanks — your message is on its way. I'll reply personally, usually within one business day.";
              if (window.gtag) gtag('event', 'generate_lead', { method: 'form', service: form.dataset.service, page: location.pathname });
            })
            .catch(function () {
              button.disabled = false;
              status.textContent = 'Something went wrong sending that. Please try again, or email bickel.rob@gmail.com.';
            });
        });
      });
    </script>
  </body>
</html>
