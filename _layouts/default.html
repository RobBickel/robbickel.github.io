<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.data.settings.seo.description }}">
    <link rel="author" href="{{ site.data.settings.seo.rel-author }}">
    <link rel="stylesheet" href="{{ site.github.url }}/assets/css/site.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
    {% feed_meta %}
    {% include analytics.html %}
    <!-- Use Jekyll SEO plugin (also renders <title>) -->
    {% seo %}
  </head>
  <body class="{{ page.layout }}">
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}

    <script>
      document.getElementById('navToggle').addEventListener('click', function () {
        var open = document.body.classList.toggle('nav-open');
        this.setAttribute('aria-expanded', open);
      });

      // Two-step intake form: step through, submit to Formspree in place, and report the
      // funnel to GA4: intake_view > intake_start > intake_step > intake_submit, or intake_abandon.
      // Remember ad UTM tags for the visit, so a lead on a later page still traces back to its ad.
      var utm = {};
      try {
        var q = new URLSearchParams(location.search);
        ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
          if (q.get(k)) utm[k] = q.get(k);
        });
        if (Object.keys(utm).length) sessionStorage.setItem('utm', JSON.stringify(utm));
        else utm = JSON.parse(sessionStorage.getItem('utm') || '{}');
      } catch (err) { /* storage blocked: use whatever was on this URL */ }

      document.querySelectorAll('.intake').forEach(function (form) {
        var status = form.querySelector('.form-status');
        var label = form.querySelector('.intake-step-label');
        var t = { started: false, submitted: false, abandoned: false, startTime: 0, maxStep: 1, lastField: '' };

        function track(name, params) {
          if (!window.gtag) return;
          var picked = form.querySelector('input[name="persona"]:checked');
          var base = {
            form_service: form.dataset.service,
            page_path: location.pathname,
            form_step: Number(form.dataset.step || 1),
            persona: picked ? picked.value : '(none)',
            page_persona: form.dataset.pagePersona || 'none',
            utm_campaign: utm.utm_campaign || '(none)',
            utm_content: utm.utm_content || '(none)'
          };
          for (var k in params) base[k] = params[k];
          gtag('event', name, base);
        }
        function snapshot() {
          var data = new FormData(form);
          var filled = ['name', 'email', 'company', 'role', 'phone', 'message'].filter(function (f) {
            return (data.get(f) || '').trim() !== '';
          });
          return {
            situations_selected: data.getAll('situation').length,
            systems: data.get('systems') || '(none)',
            timeline: data.get('timeline') || '(none)',
            contact_fields_filled: filled.length,
            last_field: t.lastField || '(none)',
            seconds_on_form: t.startTime ? Math.round((Date.now() - t.startTime) / 1000) : 0
          };
        }
        function show(step) {
          form.dataset.step = step;
          label.textContent = 'Step ' + step + ' of 2';
          if (step === '2') form.querySelector('[data-step="2"] input').focus();
        }

        form.classList.add('js-steps');
        show('1');

        // Seen: fires once when at least half the form is on screen.
        if ('IntersectionObserver' in window) {
          var io = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) { track('intake_view', {}); io.disconnect(); }
          }, { threshold: 0.5 });
          io.observe(form);
        }

        // Started: first interaction with any field or chip.
        function markStart(e) {
          var name = e.target && e.target.name;
          if (!name || name.charAt(0) === '_') return;
          t.lastField = name;
          if (!t.started) {
            t.started = true;
            t.startTime = Date.now();
            track('intake_start', { first_field: name });
          }
        }
        form.addEventListener('focusin', markStart);
        form.addEventListener('change', markStart);

        form.querySelector('.intake-next').addEventListener('click', function () {
          show('2');
          if (t.maxStep < 2) { t.maxStep = 2; track('intake_step', snapshot()); }
        });
        form.querySelector('.intake-back').addEventListener('click', function () {
          show('1');
          track('intake_back', {});
        });

        // Abandoned: started but left the page (or tab) without submitting. Reported once.
        function abandon() {
          if (!t.started || t.submitted || t.abandoned) return;
          t.abandoned = true;
          var snap = snapshot();
          snap.max_step = t.maxStep;
          snap.transport_type = 'beacon';
          track('intake_abandon', snap);
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') abandon();
        });
        window.addEventListener('pagehide', abandon);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var required = form.querySelectorAll('[data-step="2"] [required]');
          for (var i = 0; i < required.length; i++) {
            if (!required[i].checkValidity()) {
              track('intake_validation_error', { field: required[i].name });
              required[i].reportValidity();
              return;
            }
          }
          var data = new FormData(form);
          var situations = data.getAll('situation');
          data.delete('situation');
          data.append('situation', situations.join('; ') || 'Not specified');
          var details = [data.get('timeline'), data.get('systems') && data.get('systems') + ' systems'].filter(Boolean).join(', ');
          var personaLabels = { corporate: 'Portfolio governance', 'ai-sprawl': 'AI sprawl', production: 'Production readiness', other: 'Other' };
          var personaLabel = personaLabels[data.get('persona')] || form.dataset.service;
          data.set('_subject', personaLabel + ' inquiry: ' + data.get('company') + (details ? ' (' + details + ')' : ''));
          data.set('persona_page', form.dataset.pagePersona || 'none');
          for (var u in utm) data.set(u, utm[u]);
          var snap = snapshot();

          var button = form.querySelector('button[type="submit"]');
          button.disabled = true;
          status.textContent = 'Sending…';
          fetch(form.action, { method: 'POST', body: data, headers: { Accept: 'application/json' } })
            .then(function (res) {
              if (!res.ok) throw new Error(res.status);
              t.submitted = true;
              form.reset();
              form.classList.add('sent');
              status.textContent = "Thanks, it's on its way. I'll reply personally within one business day.";
              track('intake_submit', snap);
              track('generate_lead', { method: 'form', systems: snap.systems, timeline: snap.timeline });
            })
            .catch(function (err) {
              button.disabled = false;
              status.textContent = 'Something went wrong sending that. Please try again, or email bickel.rob@gmail.com.';
              track('intake_submit_error', { error: String(err && err.message || err) });
            });
        });
      });
    </script>
  </body>
</html>
