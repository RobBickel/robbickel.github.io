<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.data.settings.seo.description }}">
    <link rel="author" href="{{ site.data.settings.seo.rel-author }}">
    <link rel="stylesheet" href="{{ site.github.url }}/assets/css/site.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
    {% feed_meta %}
    {% include analytics.html %}
    <!-- Use Jekyll SEO plugin (also renders <title>) -->
    {% seo %}
  </head>
  <body class="{{ page.layout }}">
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}

    <script>
      document.getElementById('navToggle').addEventListener('click', function () {
        var open = document.body.classList.toggle('nav-open');
        this.setAttribute('aria-expanded', open);
      });

      // Two-step intake form: step through, then submit to Formspree in place and count as a lead.
      document.querySelectorAll('.intake').forEach(function (form) {
        var status = form.querySelector('.form-status');
        var label = form.querySelector('.intake-step-label');
        function show(step) {
          form.dataset.step = step;
          label.textContent = 'Step ' + step + ' of 2';
          if (step === '2') form.querySelector('[data-step="2"] input').focus();
        }
        form.classList.add('js-steps');
        show('1');
        form.querySelector('.intake-next').addEventListener('click', function () { show('2'); });
        form.querySelector('.intake-back').addEventListener('click', function () { show('1'); });

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var required = form.querySelectorAll('[data-step="2"] [required]');
          for (var i = 0; i < required.length; i++) {
            if (!required[i].checkValidity()) { required[i].reportValidity(); return; }
          }
          var data = new FormData(form);
          var situations = data.getAll('situation');
          data.delete('situation');
          data.append('situation', situations.join('; ') || 'Not specified');
          var details = [data.get('timeline'), data.get('systems') && data.get('systems') + ' systems'].filter(Boolean).join(', ');
          data.set('_subject', form.dataset.service + ' inquiry: ' + data.get('company') + (details ? ' (' + details + ')' : ''));

          var button = form.querySelector('button[type="submit"]');
          button.disabled = true;
          status.textContent = 'Sending…';
          fetch(form.action, { method: 'POST', body: data, headers: { Accept: 'application/json' } })
            .then(function (res) {
              if (!res.ok) throw new Error(res.status);
              form.reset();
              form.classList.add('sent');
              status.textContent = "Thanks, it's on its way. I'll reply personally, usually within one business day.";
              if (window.gtag) gtag('event', 'generate_lead', { method: 'form', service: form.dataset.service, page: location.pathname });            })
            .catch(function () {
              button.disabled = false;
              status.textContent = 'Something went wrong sending that. Please try again, or email bickel.rob@gmail.com.';
            });
        });
      });
    </script>
  </body>
</html>
