# Build settings

port: 4000
markdown:  kramdown
permalink: /:title
plugins:   [jekyll-sitemap, jekyll-feed,  jekyll-seo-tag]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)

title:		   "Rob Bickel"
description: "Managed software services for the applications your business runs on."
author:      "Rob Bickel"
url:         "https://robbickel.com"

exclude: [README.md, LICENSE.md, Gemfile, Gemfile.lock, portfolio-jekyll-theme.gemspec, collateral, vendor, .claude]

defaults:
  - scope: {path: "", type: posts}
    values: {layout: post, permalink: "/blog/:title/", author: "Rob Bickel"}
