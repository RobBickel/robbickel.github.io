{% assign s = site.data.settings %}
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <p class="brand-name">{{ site.title }}</p>
      <p class="muted">{{ s.tagline }} · Wildwood, Missouri</p>
      <p><a href="mailto:{{ s.email }}">{{ s.email }}</a></p>
    </div>
    <nav class="footer-nav">
      {% for item in s.menu %}
        <a href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
      {% endfor %}
      <a href="{{ site.github.url }}/resources/">Free guides</a>
      <a href="{{ site.github.url }}/privacy/">Privacy</a>
    </nav>
    <div class="social">
      {% for item in s.social %}
        <a href="{{ item.link }}" target="_blank" rel="noopener" aria-label="{{ item.icon }}"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </div>
  </div>
  <div class="wrap footer-legal muted">© {{ site.time | date: "%Y" }} {{ site.title }}</div>
</footer>
