{% if site.data.settings.google-analytics-ua %}
<script>
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

  ga('create', '{{ site.data.settings.google-analytics-ua }}', 'auto');
  ga('send', 'pageview');
</script>
{% endif %}

{% if site.data.settings.google-analytics-ga4 %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.data.settings.google-analytics-ga4 }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.data.settings.google-analytics-ga4 }}');
</script>
{% endif %}

{% if site.data.settings.linkedin-partner-id != '' %}
<script type="text/javascript">
  _linkedin_partner_id = "{{ site.data.settings.linkedin-partner-id }}";
  window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
  window._linkedin_data_partner_ids.push(_linkedin_partner_id);
</script>
<script type="text/javascript">
  (function(l) {
    if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
    window.lintrk.q=[]}
    var s = document.getElementsByTagName("script")[0];
    var b = document.createElement("script");
    b.type = "text/javascript";b.async = true;
    b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
    s.parentNode.insertBefore(b, s);})(window.lintrk);
</script>
<noscript>
  <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid={{ site.data.settings.linkedin-partner-id }}&fmt=gif" />
</noscript>
{% endif %}

<script>
  // Count email-link clicks as leads in GA4.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="mailto:"]');
    if (a && window.gtag) gtag('event', 'generate_lead', { method: 'email', page: location.pathname });
  });
</script>
