{% if site.data.settings.google-tag-manager %}
<script>
  // gtag() pushes onto the dataLayer; the GA4 Google tag in the GTM container sends these events.
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
</script>
<!-- Google Tag Manager: GA4 and the LinkedIn Insight Tag are configured in the container -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','{{ site.data.settings.google-tag-manager }}');</script>
<!-- End Google Tag Manager -->
{% endif %}

<script>
  // Count email-link clicks as leads in GA4.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="mailto:"]');
    if (a && window.gtag) gtag('event', 'generate_lead', { method: 'email', page: location.pathname });
  });
</script>
